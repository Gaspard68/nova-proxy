
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1b">
  <title>Nova Proxy</title>
  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #080d1b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #40eaff;
      letter-spacing: 3px;
    }
    p { color: #aab8d1; }
    iframe {
      width: 100%;
      height: 65vh;
      margin-top: 20px;
      border: 1px solid #40eaff;
      border-radius: 14px;
      background: white;
    }
  </style>
</head>
<body>
  <h1>NOVA PROXY</h1>
  <p>FUTURE WEB · Serveur de démonstration</p>
  <p>Le domaine autorisé est example.com.</p>
  <iframe
    title="Page de démonstration"
    src="/proxy/example.com/">
  </iframe>
</body>
</html>
